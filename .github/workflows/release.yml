name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, without the leading v (for example 1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Restore release signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.STOCKER_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/stocker-release.jks"
            echo "STOCKER_KEYSTORE_FILE=$RUNNER_TEMP/stocker-release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=permanent release key" >> "$GITHUB_ENV"
          else
            echo "SIGNING=CI debug key (not permanent; uninstall before updating to a later build)" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          STOCKER_KEYSTORE_PASSWORD: ${{ secrets.STOCKER_KEYSTORE_PASSWORD }}
          STOCKER_KEY_ALIAS: ${{ secrets.STOCKER_KEY_ALIAS }}
          STOCKER_KEY_PASSWORD: ${{ secrets.STOCKER_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Collect assets
        run: |
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Stocker-${TAG}.apk"
          cd dist && sha256sum "Stocker-${TAG}.apk" > "Stocker-${TAG}.apk.sha256"

      - name: Compose release notes
        run: |
          VER="${TAG#v}"
          awk -v v="$VER" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes_body.md
          {
            cat notes_body.md
            echo
            echo "### Install"
            echo "1. Download **Stocker-${TAG}.apk** below on your Android phone (Android 8.0 or newer)."
            echo "2. Open it and allow installs from your browser or file manager if Android asks."
            echo "3. Optional: verify the download against the attached .sha256 file."
            echo
            echo "**Signing:** ${SIGNING}"
            echo
            echo "_Stocker provides information only. Nothing in the app is financial advice._"
          } > release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "Stocker ${TAG}" \
            --notes-file release-notes.md
