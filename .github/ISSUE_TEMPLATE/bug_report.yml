name: Bug report
description: Something is broken or looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Watchlist\n2. Tap RELIANCE\n3. ..."
  - type: input
    id: version
    attributes:
      label: App version
      placeholder: "1.0.0"
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Moto G35 5G, Android 15"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
